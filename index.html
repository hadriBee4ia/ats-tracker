<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0E1116">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ATS">
<title>Journal ATS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2308080F'/%3E%3Ctext x='32' y='44' font-family='Arial' font-size='30' font-weight='700' fill='%238B5CF6' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E">
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');
:root{
  --ink:#08080F; --panel:#12121E; --panel2:#1A1A2B; --border:#2A2A42;
  --chalk:#ECECF6; --muted:#8686A6; --amber:#8B5CF6; --violet2:#A78BFA; --blue:#38BDF8; --green:#34D399;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; background:var(--ink);}
body{color:var(--chalk); font-family:'Space Grotesk',-apple-system,system-ui,sans-serif;}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;}
.ats{min-height:100vh; max-width:560px; margin:0 auto; padding:0 0 150px;}
header{position:sticky; top:0; z-index:20; background:linear-gradient(180deg,var(--ink) 72%,transparent);
  padding:22px 20px 14px; display:flex; align-items:flex-end; justify-content:space-between;}
.mark{display:flex; align-items:baseline; gap:10px;}
.mark b{font-size:30px; font-weight:700; letter-spacing:-1px;}
.mark span{font-size:12px; color:var(--muted); letter-spacing:.5px;}
.meta{text-align:right; font-size:11px; color:var(--muted); line-height:1.5;}
.meta .wk{color:var(--chalk); font-weight:600;}
.chip-deload{display:inline-block; margin-top:3px; font-size:10px; font-weight:700; letter-spacing:.6px;
  color:var(--amber); border:1px solid var(--amber); border-radius:4px; padding:1px 6px;}
.modeseg{display:flex; gap:6px; padding:0 20px 14px;}
.modeseg button{flex:1; background:var(--panel); border:1px solid var(--border); color:var(--muted);
  border-radius:10px; padding:9px 2px; font-family:'Space Grotesk',sans-serif; font-size:11px; font-weight:600; cursor:pointer; transition:all .15s;}
.modeseg button.on{color:#fff; background:var(--amber); border-color:var(--amber);}
.tabs{display:flex; gap:8px; padding:0 20px 16px;}
.tab{flex:1; background:var(--panel); border:1px solid var(--border); border-radius:12px;
  padding:12px 10px; cursor:pointer; text-align:left; transition:border-color .15s, transform .08s;}
.tab:active{transform:scale(.98);}
.tab .num{font-size:10px; color:var(--muted); letter-spacing:1px;}
.tab .ti{font-size:15px; font-weight:600; margin-top:4px;}
.tab .dot{width:7px; height:7px; border-radius:50%; display:inline-block; margin-right:6px; vertical-align:middle;}
.sub{padding:0 20px 14px; font-size:13px; color:var(--muted);}
.block{padding:0 20px;}
.block .elabel{font-size:11px; font-weight:700; letter-spacing:1.5px; color:var(--muted);
  text-transform:uppercase; margin:20px 0 10px; display:flex; align-items:center; gap:10px;}
.block .elabel:after{content:""; flex:1; height:1px; background:var(--border);}
.card{background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:14px; margin-bottom:10px;}
.card .nm{font-size:15px; font-weight:600; line-height:1.3;}
.card .rx{font-size:12px; color:var(--muted); margin-top:3px;}
.card .rx b{color:var(--amber); font-weight:600;}
.card .note{font-size:11px; color:var(--muted); font-style:italic; margin-top:2px;}
.last{font-size:11px; color:var(--muted); margin-top:9px;}
.last .mono{color:var(--chalk);}
.sets{display:flex; flex-direction:column; gap:7px; margin-top:11px;}
.setrow{display:flex; align-items:center; gap:8px;}
.setrow .idx{width:16px; font-size:11px; color:var(--muted); text-align:center;}
.inp{background:var(--panel2); border:1px solid var(--border); border-radius:8px; color:var(--chalk);
  font-family:'JetBrains Mono',monospace; font-size:14px; padding:8px 9px; width:100%; outline:none; transition:border-color .15s;}
.inp:focus{border-color:var(--amber);}
.inp::placeholder{color:#4d5561;}
.f-reps{flex:1.3;} .f-load{flex:1;}
.mult{color:var(--muted); font-size:12px;}
.check{flex:none; width:38px; height:38px; border-radius:9px; border:1px solid var(--border);
  background:var(--panel2); cursor:pointer; display:flex; align-items:center; justify-content:center;
  transition:all .15s; color:#4d5561;}
.check:active{transform:scale(.92);}
.check.on{background:var(--green); border-color:var(--green); color:#0E1116;}
.setrow.done .inp{border-color:rgba(52,211,153,.35);}
.stretch-actions{display:flex; gap:8px; align-items:center; margin-top:12px;}
.play{flex:1; border:1px solid var(--border); background:var(--panel2); color:var(--chalk); border-radius:9px;
  padding:11px; font-family:'Space Grotesk',sans-serif; font-size:13px; font-weight:600; cursor:pointer; transition:transform .08s;}
.play:active{transform:scale(.98);}
.savebar{position:fixed; bottom:0; left:0; right:0; z-index:30;}
.savebar-in{max-width:560px; margin:0 auto; padding:14px 20px calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,transparent,var(--ink) 34%);}
.save{width:100%; border:none; border-radius:13px; padding:16px; font-family:'Space Grotesk',sans-serif;
  font-size:15px; font-weight:700; letter-spacing:.3px; color:#fff; background:var(--amber); cursor:pointer; transition:transform .08s, opacity .15s;}
.save:active{transform:scale(.99);}
.save.empty{opacity:.4;}
.timerbar{position:fixed; left:0; right:0; bottom:80px; z-index:35; display:flex; justify-content:center; padding:0 20px; pointer-events:none;}
.timer{pointer-events:auto; max-width:520px; width:100%; background:var(--panel2); border:1px solid var(--border);
  border-radius:14px; padding:10px 12px; display:flex; align-items:center; gap:10px; box-shadow:0 12px 34px rgba(0,0,0,.5);}
.timer.done{border-color:var(--green);}
.timer .tlabel{font-size:11px; color:var(--muted); flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.timer .tclock{font-family:'JetBrains Mono',monospace; font-size:22px; font-weight:700; min-width:58px; text-align:center;}
.timer.done .tclock{color:var(--green);}
.tbtn{border:1px solid var(--border); background:var(--panel); color:var(--chalk); border-radius:8px;
  font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:700; padding:9px 10px; cursor:pointer;}
.tbtn:active{transform:scale(.94);}
.tx{width:34px; height:34px; display:flex; align-items:center; justify-content:center; padding:0;}
.toast{position:fixed; bottom:150px; left:50%; transform:translateX(-50%); z-index:40;
  background:var(--green); color:#0E1116; font-weight:600; font-size:13px; padding:10px 18px; border-radius:10px;
  box-shadow:0 8px 24px rgba(0,0,0,.4); animation:pop .25s ease;}
@keyframes pop{from{opacity:0; transform:translate(-50%,8px);} to{opacity:1; transform:translate(-50%,0);}}
.hist{padding:0 20px;}
.iobar{display:flex; gap:8px; margin-bottom:14px;}
.iobtn{flex:1; background:var(--panel); border:1px solid var(--border); color:var(--chalk); border-radius:10px;
  padding:12px; font-family:'Space Grotesk',sans-serif; font-size:13px; font-weight:600; cursor:pointer;}
.iobtn:active{transform:scale(.98);}
.hentry{background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:13px 15px; margin-bottom:9px;}
.hentry .hh{display:flex; justify-content:space-between; align-items:center;}
.hentry .hd{font-size:12px; color:var(--muted);}
.hentry .hs{font-size:14px; font-weight:600;}
.hentry .hb{font-size:11px; color:var(--muted); margin-top:6px; line-height:1.6; white-space:pre-line;}
.empty-h{text-align:center; color:var(--muted); font-size:13px; padding:40px 20px; line-height:1.6;}
.danger{background:none; border:1px solid var(--border); color:var(--muted); border-radius:8px;
  font-family:'Space Grotesk',sans-serif; font-size:11px; padding:8px 12px; cursor:pointer; margin-top:8px;}
.today{margin:0 20px 18px; border:1px solid var(--amber); border-radius:16px; padding:18px; background:rgba(139,92,246,.06);}
.today.rest{border-color:var(--border); background:var(--panel);}
.today .eyebrow{font-size:11px; font-weight:700; letter-spacing:1.5px; color:var(--amber); text-transform:uppercase;}
.today.rest .eyebrow{color:var(--muted);}
.today .tact{font-size:26px; font-weight:700; letter-spacing:-.5px; margin-top:9px; display:flex; align-items:center; gap:11px;}
.today .tact .dot{width:11px; height:11px; border-radius:50%; flex:none;}
.today .tsub{font-size:13px; color:var(--muted); margin-top:8px; line-height:1.5;}
.today .cta{width:100%; margin-top:16px; border:none; border-radius:12px; padding:15px; font-family:'Space Grotesk',sans-serif; font-size:15px; font-weight:700; color:#fff; background:var(--amber); cursor:pointer;}
.today .cta:active{transform:scale(.99);}
.today .altlink{display:block; width:100%; text-align:center; margin-top:11px; background:none; border:none; color:var(--muted); font-family:'Space Grotesk',sans-serif; font-size:12px; text-decoration:underline; text-underline-offset:3px; cursor:pointer;}
.weeklist{padding:0 20px;}
.wlabel{font-size:11px; font-weight:700; letter-spacing:1.5px; color:var(--muted); text-transform:uppercase; margin:4px 0 11px;}
.wrow{display:flex; align-items:center; gap:11px; padding:13px 14px; border:1px solid var(--border); border-radius:12px; margin-bottom:8px; background:var(--panel); transition:transform .08s;}
.wrow.clickable{cursor:pointer;}
.wrow.clickable:active{transform:scale(.99);}
.wrow.now{border-color:var(--amber); box-shadow:inset 0 0 0 1px var(--amber);}
.wrow .wday{width:76px; font-size:13px; font-weight:600; color:var(--muted); flex:none;}
.wrow.now .wday{color:var(--chalk);}
.wrow .wdot{width:9px; height:9px; border-radius:50%; flex:none;}
.wrow .wmid{flex:1; min-width:0;}
.wrow .wact{font-size:15px; font-weight:600;}
.wrow .wsub{font-size:11px; color:var(--muted); margin-top:1px;}
.wrow .nowchip{font-size:9px; font-weight:700; letter-spacing:.5px; color:#fff; background:var(--amber); border-radius:4px; padding:2px 6px; flex:none;}
.wrow .wgo{color:var(--muted); font-size:20px; flex:none; line-height:1;}
.prog{padding:0 20px;}
.progsel{width:100%; background:var(--panel2); border:1px solid var(--border); color:var(--chalk); border-radius:10px; padding:12px; font-family:'Space Grotesk',sans-serif; font-size:14px; font-weight:600; margin-bottom:14px; -webkit-appearance:none; appearance:none;}
.chartcard{background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:14px;}
.chart{width:100%; height:auto; display:block;}
.pcap{font-size:11px; color:var(--muted); margin-top:10px; text-align:center; line-height:1.5;}
.pstats{display:flex; gap:9px; margin-top:14px;}
.pstat{flex:1; background:var(--panel2); border:1px solid var(--border); border-radius:10px; padding:11px 6px; text-align:center;}
.pstat .pv{font-size:20px; font-weight:700;}
.pstat .pl{font-size:10px; color:var(--muted); margin-top:2px;}
.howbtn{margin-top:11px; background:none; border:none; color:var(--violet2); font-family:'Space Grotesk',sans-serif; font-size:12px; font-weight:600; cursor:pointer; padding:0;}
.howbtn:active{opacity:.6;}
.howpanel{display:none; margin-top:10px; padding:12px 13px; background:var(--panel2); border:1px solid var(--border); border-radius:10px;}
.howpanel.open{display:block;}
.howmove{font-size:13px; color:var(--chalk); line-height:1.55;}
.howcues{margin-top:11px; display:flex; flex-direction:column; gap:7px;}
.cue{font-size:12px; color:var(--muted); line-height:1.45; padding-left:16px; position:relative;}
.cue:before{content:"▸"; position:absolute; left:0; top:1px; color:var(--amber); font-size:10px;}
.coach{margin-top:10px; font-size:12px; font-weight:600; color:var(--green); background:rgba(52,211,153,.1); border:1px solid rgba(52,211,153,.35); border-radius:8px; padding:8px 10px;}
.demolink{display:inline-block; margin-top:11px; color:var(--blue); font-size:12px; font-weight:600; text-decoration:none; border:1px solid var(--border); border-radius:8px; padding:8px 11px;}
.demolink:active{opacity:.6;}
.wcard{background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:14px; margin-bottom:18px;}
.wtitle{font-size:13px; font-weight:700; letter-spacing:.3px; margin-bottom:11px;}
.wrow2{display:flex; gap:8px; margin-bottom:6px;}
.winp{flex:1; background:var(--panel2); border:1px solid var(--border); border-radius:9px; color:var(--chalk); font-family:'JetBrains Mono',monospace; font-size:15px; padding:10px; outline:none;}
.winp:focus{border-color:var(--amber);}
.wsave{border:none; border-radius:9px; background:var(--amber); color:#fff; font-family:'Space Grotesk',sans-serif; font-size:13px; font-weight:700; padding:0 16px; cursor:pointer;}
.wsave:active{transform:scale(.98);}
.plabel{font-size:11px; font-weight:700; letter-spacing:1.5px; color:var(--muted); text-transform:uppercase; margin:2px 0 10px;}
.wload{display:flex; gap:8px; margin:0 20px 16px;}
.wloaditem{flex:1; background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:10px 6px; text-align:center;}
.wloaditem .wv{font-size:19px; font-weight:700;}
.wloaditem .wl{font-size:10px; color:var(--muted); margin-top:1px;}
.combatbtn{width:100%; margin-top:14px; border:none; border-radius:12px; padding:14px; font-family:'Space Grotesk',sans-serif; font-size:14px; font-weight:700; color:#fff; background:var(--amber); cursor:pointer;}
.combatbtn:active{transform:scale(.99);}
.combatbtn.done{background:var(--panel2); color:var(--green); border:1px solid rgba(52,211,153,.4);}
.saverem{font-size:11px; color:var(--muted); margin-bottom:12px; text-align:center;}
.saverem.warn{color:var(--amber);}
</style>
</head>
<body>
<div class="ats">
  <header id="hdr"></header>
  <div class="modeseg" id="nav"></div>
  <div id="main"></div>
</div>
<div id="timerbar"></div>
<div id="toast"></div>
<input type="file" id="importfile" accept="application/json,.json" style="display:none">

<script>
/* ============================================================
   Journal ATS — version HTML autonome
   Aucune dépendance de build, aucun serveur.
   Données en localStorage + export/import JSON de secours.
   ============================================================ */

var SESSIONS = [
  { id:"s1", n:"01", title:"Push", long:"Haut du corps · priorité poussée", tag:"#E879F9", blocks:[
    { label:"Force", items:[
      { id:"s1f1", name:"Dips lestées", sets:5, reps:"4–6", rest:"2–3 min", restSec:150, note:"RIR 1–2 · lest au sac", load:true },
      { id:"s1f2", name:"Pseudo-planche push-ups", sets:4, reps:"5–8", rest:"2 min", restSec:120, note:"corps incliné vers l'avant" } ]},
    { label:"Volume", items:[
      { id:"s1v1", name:"Pompes déclinées / diamant", sets:3, reps:"10–15", rest:"75 s", restSec:75, note:"RIR 0–1" },
      { id:"s1v2", name:"Pike push-ups (pieds surélevés)", sets:3, reps:"8–12", rest:"75 s", restSec:75, note:"poussée verticale" },
      { id:"s1v3", name:"Tractions pronation", sets:3, reps:"6–10", rest:"90 s", restSec:90, note:"maintient le pull" } ]},
    { label:"Core", items:[
      { id:"s1c1", name:"Relevés de jambes suspendus", sets:3, reps:"8–12", rest:"60 s", restSec:60, note:"descente contrôlée" } ]}
  ]},
  { id:"s2", n:"02", title:"Jambes", long:"Bas du corps + core · priorité jambes", tag:"#38BDF8", blocks:[
    { label:"Force", items:[
      { id:"s2f1", name:"Squats bulgares lestés", sets:4, reps:"6–8 /j", rest:"2 min", restSec:120, note:"RIR 1–2", load:true },
      { id:"s2f2", name:"Nordic curls", sets:4, reps:"4–8", rest:"2 min", restSec:120, note:"assisté / négatif si besoin" } ]},
    { label:"Volume", items:[
      { id:"s2v1", name:"Pistol squats", sets:3, reps:"5–8 /j", rest:"90 s", restSec:90, note:"box ou assisté" },
      { id:"s2v2", name:"Hip thrust une jambe", sets:3, reps:"10–15", rest:"75 s", restSec:75, load:true },
      { id:"s2v3", name:"Mollets debout une jambe", sets:3, reps:"12–20", rest:"60 s", restSec:60, note:"amplitude complète" } ]},
    { label:"Core", items:[
      { id:"s2c1", name:"Dragon flag", sets:3, reps:"4–8", rest:"90 s", restSec:90, note:"tuck / négatif" },
      { id:"s2c2", name:"Gainage hollow body", sets:3, reps:"30–45 s", rest:"45 s", restSec:45, note:"lombaires plaquées" } ]}
  ]},
  { id:"s3", n:"03", title:"Pull", long:"Haut du corps · priorité tirage", tag:"#A78BFA", blocks:[
    { label:"Force", items:[
      { id:"s3f1", name:"Tractions lestées", sets:5, reps:"4–6", rest:"2–3 min", restSec:150, note:"RIR 1–2 · lest au sac", load:true },
      { id:"s3f2", name:"Front lever (progression)", sets:4, reps:"8–15 s", rest:"2 min", restSec:120, note:"tuck → straddle" } ]},
    { label:"Volume", items:[
      { id:"s3v1", name:"Tractions supination", sets:3, reps:"8–12", rest:"90 s", restSec:90, note:"dos + biceps" },
      { id:"s3v2", name:"Rows australiens", sets:3, reps:"10–15", rest:"75 s", restSec:75, note:"tire au sternum" },
      { id:"s3v3", name:"Dips (sans lest)", sets:3, reps:"8–12", rest:"75 s", restSec:75, note:"maintient le push" } ]},
    { label:"Core", items:[
      { id:"s3c1", name:"Toes-to-bar / L-sit", sets:3, reps:"6–10", rest:"60 s", restSec:60, note:"ou tenue 15–25 s" } ]}
  ]}
];

var STRETCH = [
  { id:"m1", n:"01", title:"Mobilité Push", long:"Après la séance Push · épaules, pecs, poignets", tag:"#E879F9", items:[
    { id:"m1a", name:"Pectoraux à la porte", hold:"45 s /côté", holdSec:45, note:"avant-bras contre le montant" },
    { id:"m1b", name:"Épaule croisée (cross-body)", hold:"30 s /côté", holdSec:30 },
    { id:"m1c", name:"Triceps au-dessus de la tête", hold:"30 s /côté", holdSec:30 },
    { id:"m1d", name:"Extension poignets, paumes au sol", hold:"40 s", holdSec:40, note:"à genoux, doigts vers toi" },
    { id:"m1e", name:"Flexion poignets, dos des mains au sol", hold:"40 s", holdSec:40 },
    { id:"m1f", name:"Dislocations d'épaule au bâton", hold:"10 lentes", holdSec:40, note:"amplitude progressive" } ]},
  { id:"m2", n:"02", title:"Mobilité Jambes", long:"Après la séance Jambes · ischios, hanches, chevilles", tag:"#38BDF8", items:[
    { id:"m2a", name:"Ischios debout, jambe tendue", hold:"45 s /côté", holdSec:45, note:"dos droit, penche des hanches" },
    { id:"m2b", name:"Fente basse fléchisseur de hanche", hold:"45 s /côté", holdSec:45, note:"bascule le bassin" },
    { id:"m2c", name:"Quadriceps debout", hold:"40 s /côté", holdSec:40 },
    { id:"m2d", name:"Squat profond tenu", hold:"60 s", holdSec:60, note:"talons au sol, pousse les genoux" },
    { id:"m2e", name:"Adducteurs (grenouille)", hold:"60 s", holdSec:60 },
    { id:"m2f", name:"Mollets au mur", hold:"45 s /côté", holdSec:45, note:"jambe tendue puis fléchie" } ]},
  { id:"m3", n:"03", title:"Mobilité Pull + Combat", long:"Jours de pull ou de combat · dos, thoracique, hanches", tag:"#A78BFA", items:[
    { id:"m3a", name:"Suspension à la barre (dead hang)", hold:"30 s", holdSec:30, note:"relâche les dorsaux" },
    { id:"m3b", name:"Rotation thoracique à genoux", hold:"8 /côté", holdSec:40, note:"main derrière la tête, ouvre" },
    { id:"m3c", name:"Pigeon (hanche / fessier)", hold:"60 s /côté", holdSec:60 },
    { id:"m3d", name:"Rotations douces du cou", hold:"30 s", holdSec:30, note:"lent, sans forcer" },
    { id:"m3e", name:"Rotateurs d'épaule (sleeper)", hold:"30 s /côté", holdSec:30 },
    { id:"m3f", name:"Inclinaison latérale du tronc", hold:"30 s /côté", holdSec:30 } ]}
];

/* idx = Date.getDay() : dimanche=0, lundi=1, ... samedi=6 */
var WEEK = [
  { day:"Lundi", idx:1, kind:"force", ref:"s2", label:"Jambes", mob:"m2" },
  { day:"Mardi", idx:2, kind:"repos" },
  { day:"Mercredi", idx:3, kind:"combat", label:"Krav maga", mob:"m3" },
  { day:"Jeudi", idx:4, kind:"repos" },
  { day:"Vendredi", idx:5, kind:"force", ref:"s1", label:"Push", mob:"m1" },
  { day:"Samedi", idx:6, kind:"force", ref:"s3", label:"Pull", mob:"m3" },
  { day:"Dimanche", idx:0, kind:"combat", label:"Krav maga", mob:"m3" }

var LOG_KEY = "ats:log";
var memFallback = {};
function rawGet(k){ try { return localStorage.getItem(k); } catch(e){ return (k in memFallback)? memFallback[k] : null; } }
function rawSet(k,v){ try { localStorage.setItem(k,v); } catch(e){ memFallback[k]=v; } }

var log = (function(){ try { var v=rawGet(LOG_KEY); return v? JSON.parse(v):[]; } catch(e){ return []; } })();
function saveLog(){ rawSet(LOG_KEY, JSON.stringify(log)); }

var state = { mode:"semaine", active:"s1", routine:"m1", progEx:null };
var timer = null, timerIv = null, audioCtx = null;

/* ---------- audio + vibration ---------- */
function ensureAudio(){ try{ audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==="suspended") audioCtx.resume(); }catch(e){} }
function beep(){ try{ ensureAudio(); var o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.connect(g); g.connect(audioCtx.destination); o.type="sine"; o.frequency.value=880; var t=audioCtx.currentTime; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.35,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+0.45); o.start(t); o.stop(t+0.45);}catch(e){} }

/* ---------- helpers ---------- */
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function fmtDate(iso){ return new Date(iso).toLocaleDateString("fr-FR",{day:"2-digit",month:"short"}); }
function fmtClock(s){ var m=Math.floor(s/60), ss=String(s%60); if(ss.length<2) ss="0"+ss; return m+":"+ss; }
function weekNumber(){ if(!log.length) return 1; var first=new Date(log[0].date); return Math.floor((new Date()-first)/(7*24*3600*1000))+1; }
function lastEntry(sessionId, exId){
  for(var i=log.length-1;i>=0;i--){ var e=log[i]; if(e.type==="stretch") continue;
    if(e.sessionId===sessionId && e.entries && e.entries[exId]){ var sets=e.entries[exId].filter(function(s){return s.reps||s.done;}); if(sets.length) return sets; } }
  return null;
}
var CHECK_SVG = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';

/* ---------- render : header + nav ---------- */
function topOfRange(reps){ var m=String(reps).match(/(\d+)\D+(\d+)/); if(m) return parseInt(m[2],10); var m2=String(reps).match(/(\d+)/); return m2?parseInt(m2[1],10):null; }
function readyToProgress(item){
  var top=topOfRange(item.reps); if(top==null) return null;
  var prev=lastEntry(state.active, item.id); if(!prev) return null;
  var reps=prev.map(function(s){return parseInt(s.reps,10);}).filter(function(n){return !isNaN(n);});
  if(reps.length < item.sets) return null;
  var minReps=Math.min.apply(null, reps);
  if(minReps>=top) return item.load ? "+2,5 kg au sac" : "passe à la variation supérieure";
  return null;
}
function weekStart(){ var d=new Date(); var day=(d.getDay()+6)%7; d.setHours(0,0,0,0); d.setDate(d.getDate()-day); return d; }
function weeklyLoad(){ var ws=weekStart(), f=0,c=0,m=0; log.forEach(function(e){ if(new Date(e.date)>=ws){ if(e.type==="combat")c++; else if(e.type==="stretch")m++; else if(e.type==="strength"||(!e.type&&e.entries))f++; } }); return {f:f,c:c,m:m}; }
function weightSeries(){ var out=[]; log.forEach(function(e){ if(e.type==="weight"){ var v=parseFloat(String(e.kg).replace(",",".")); if(!isNaN(v)) out.push({date:e.date, v:v}); } }); return out; }
function combatDoneToday(){ var t=new Date(); t.setHours(0,0,0,0); return log.some(function(e){ return e.type==="combat" && new Date(e.date)>=t; }); }
function setLastExport(){ rawSet("ats:lastexport", new Date().toISOString()); }
function lastExportDays(){ var v=rawGet("ats:lastexport"); if(!v) return null; return Math.floor((new Date()-new Date(v))/(24*3600*1000)); }

function renderHeader(){
  var wk=weekNumber(), deload=(((wk-1)%6)+1===6);
  var count=log.filter(function(e){return e.type==="strength"||(!e.type&&e.entries);}).length;
  document.getElementById("hdr").innerHTML =
    '<div class="mark"><b>ATS</b><span>Journal de force</span></div>'+
    '<div class="meta"><div class="wk mono">Semaine ~'+wk+'</div><div class="mono">'+count+' séances</div>'+
    (deload?'<div class="chip-deload">DELOAD CONSEILLÉ</div>':'')+'</div>';
}
function renderNav(){
  var m=state.mode;
  var defs=[["semaine","Semaine"],["force","Force"],["mobilite","Mobilité"],["prog","Progrès"],["hist","Histo."]];
  document.getElementById("nav").innerHTML = defs.map(function(d){
    return '<button data-mode="'+d[0]+'" class="'+(m===d[0]?"on":"")+'">'+d[1]+'</button>';
  }).join("");
  Array.prototype.forEach.call(document.querySelectorAll("#nav button"), function(b){
    b.onclick=function(){ state.mode=b.getAttribute("data-mode"); renderMain(); renderNav(); };
  });
}

/* ---------- render : main ---------- */
function renderMain(){
  var m=state.mode, html="";
  if(m==="semaine") html=viewSemaine();
  else if(m==="force") html=viewForce();
  else if(m==="mobilite") html=viewMobilite();
  else if(m==="prog") html=viewProgress();
  else if(m==="hist") html=viewHist();
  document.getElementById("main").innerHTML=html;
  if(m==="semaine") wireSemaine();
  else if(m==="force") wireForce();
  else if(m==="mobilite") wireMobilite();
  else if(m==="prog") wireProgress();
  else if(m==="hist") wireHist();
}

/* ---- Semaine ---- */
function viewSemaine(){
  var dow=new Date().getDay();
  var tp=WEEK.filter(function(w){return w.idx===dow;})[0];
  var h="";
  if(tp.kind==="force"){
    var ts=SESSIONS.filter(function(x){return x.id===tp.ref;})[0];
    h+='<div class="today"><div class="eyebrow">Aujourd\'hui · '+tp.day+'</div>'+
       '<div class="tact"><span class="dot" style="background:'+ts.tag+'"></span>'+tp.label+'</div>'+
       '<button class="cta" data-go="'+tp.ref+'">Commencer la séance</button>'+
       '<button class="altlink" data-mob="'+tp.mob+'">Étirements à faire après →</button></div>';
  } else if(tp.kind==="combat"){
    var cdone=combatDoneToday();
    h+='<div class="today"><div class="eyebrow">Aujourd\'hui · '+tp.day+'</div>'+
       '<div class="tact"><span class="dot" style="background:#8B5CF6"></span>Krav maga <span style="font-size:14px;color:var(--muted);font-weight:500;">· soir</span></div>'+
       '<div class="tsub">Journée combat. Garde les jambes fraîches.</div>'+
       '<button class="combatbtn'+(cdone?" done":"")+'" data-combat="1"'+(cdone?" disabled":"")+'>'+(cdone?"Fait aujourd\'hui ✓":"Marquer le krav comme fait")+'</button>'+
       '<button class="altlink" data-mob="m3">Mobilité Pull + Combat (échauffement) →</button></div>';
  } else {
    h+='<div class="today rest"><div class="eyebrow">Aujourd\'hui · '+tp.day+'</div>'+
       '<div class="tact">Repos complet</div>'+
       '<div class="tsub">Récupère — c\'est là que les progrès se consolident.</div></div>';
  }
  var wl=weeklyLoad();
  h+='<div class="wload">'+
     '<div class="wloaditem"><div class="wv mono">'+wl.f+'</div><div class="wl">force</div></div>'+
     '<div class="wloaditem"><div class="wv mono">'+wl.c+'</div><div class="wl">combat</div></div>'+
     '<div class="wloaditem"><div class="wv mono">'+wl.m+'</div><div class="wl">mobilité</div></div></div>';
  h+='<div class="weeklist"><div class="wlabel">La semaine</div>';
  WEEK.forEach(function(w){
    var s=(w.kind==="force")?SESSIONS.filter(function(x){return x.id===w.ref;})[0]:null;
    var now=(w.idx===dow), clickable=(w.kind==="force");
    h+='<div class="wrow'+(now?" now":"")+(clickable?" clickable":"")+'"'+(clickable?' data-go="'+w.ref+'"':'')+'>'+
       '<div class="wday">'+w.day+'</div>'+
       (w.kind!=="repos"?'<span class="wdot" style="background:'+(s?s.tag:"#8B5CF6")+'"></span>':'')+
       '<div class="wmid"><div class="wact">'+(w.kind==="repos"?"Repos":w.label)+'</div>'+
       '<div class="wsub">'+(w.kind==="force"?"Force + étirements":w.kind==="combat"?"Soir":"Récupération")+'</div></div>'+
       (now?'<span class="nowchip">AUJ.</span>':'')+
       (clickable?'<span class="wgo">›</span>':'')+'</div>';
  });
  h+='</div>';
  return h;
}
function wireSemaine(){
  Array.prototype.forEach.call(document.querySelectorAll("[data-go]"), function(el){
    el.onclick=function(){ state.active=el.getAttribute("data-go"); state.mode="force"; renderMain(); renderNav(); window.scrollTo(0,0); };
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-mob]"), function(el){
    el.onclick=function(){ state.routine=el.getAttribute("data-mob"); state.mode="mobilite"; renderMain(); renderNav(); window.scrollTo(0,0); };
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-combat]"), function(el){
    el.onclick=function(){ if(combatDoneToday()) return; log.push({type:"combat", date:new Date().toISOString(), label:"Krav maga"}); saveLog(); renderMain(); renderHeader(); flash("Krav maga enregistré"); };
  });
}

        '<div class="howcues">'+ht.cues.map(function(c){return '<div class="cue">'+esc(c)+'</div>';}).join("")+'</div>'+
        '<a class="demolink" href="https://www.youtube.com/results?search_query='+encodeURIComponent(it.name+' calisthenics form')+'" target="_blank" rel="noopener">▶ Voir une démo vidéo</a></div>'; }
      if(prev){ h+='<div class="last">dernière fois : <span class="mono">'+prev.map(function(s){return (s.reps||"·")+(s.load?"+"+s.load+"kg":"");}).join("  ·  ")+'</span></div>'; }
      var rp=readyToProgress(it);
      if(rp){ h+='<div class="coach">⤴ Prêt à monter d\'un cran · '+rp+'</div>'; }
      h+='<div class="sets">';
      for(var i=0;i<it.sets;i++){
        h+='<div class="setrow" data-ex="'+it.id+'">'+
           '<span class="idx mono">'+(i+1)+'</span>'+
           '<input class="inp f-reps" inputmode="numeric" placeholder="'+esc(it.reps)+'">'+
           '<span class="mult">×</span>'+
           '<input class="inp f-load" inputmode="numeric" placeholder="'+(it.load?"kg":"—")+'">'+
           '<button class="check" data-rest="'+it.restSec+'" data-name="'+esc(it.name)+'" aria-label="Valider la série">'+CHECK_SVG+'</button></div>';
      }
      h+='</div></div>';
    });
    h+='</div>';
  });
  h+='<div class="savebar"><div class="savebar-in"><button class="save empty" id="finishForce">Terminer la séance</button></div></div>';
  return h;
}
function wireForce(){
  Array.prototype.forEach.call(document.querySelectorAll("[data-sess]"), function(b){
    b.onclick=function(){ state.active=b.getAttribute("data-sess"); renderMain(); };
  });
  Array.prototype.forEach.call(document.querySelectorAll("#main .check"), function(btn){
    btn.onclick=function(){
      var row=btn.closest(".setrow");
      var nowDone=!row.classList.contains("done");
      row.classList.toggle("done"); btn.classList.toggle("on");
      refreshFinishForce();
      if(nowDone){ startTimer(parseInt(btn.getAttribute("data-rest"),10), "Repos · "+btn.getAttribute("data-name")); }
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll("#main .howbtn"), function(btn){
    btn.onclick=function(){
      var p=document.getElementById("how-"+btn.getAttribute("data-how"));
      var open=p.classList.toggle("open");
      btn.textContent = open ? "Masquer les détails" : "Comment faire ›";
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll("#main .inp"), function(inp){
    inp.oninput=refreshFinishForce;
  });
  var fin=document.getElementById("finishForce");
  if(fin) fin.onclick=finishForce;
  refreshFinishForce();
}
function collectForce(){
  var entries={};
  var sess=SESSIONS.filter(function(x){return x.id===state.active;})[0];
  sess.blocks.forEach(function(b){ b.items.forEach(function(it){
    var rows=document.querySelectorAll('.setrow[data-ex="'+it.id+'"]');
    var kept=[];
    Array.prototype.forEach.call(rows, function(r){
      var reps=r.querySelector(".f-reps").value.trim();
      var load=r.querySelector(".f-load").value.trim();
      var done=r.classList.contains("done");
      if(reps||done) kept.push({reps:reps, load:load, done:done});
    });
    if(kept.length) entries[it.id]=kept;
  }); });
  return entries;
}
function refreshFinishForce(){
  var fin=document.getElementById("finishForce"); if(!fin) return;
  var any=Object.keys(collectForce()).length>0;
  fin.className = "save"+(any?"":" empty");
}
function finishForce(){
  var entries=collectForce();
  if(Object.keys(entries).length===0) return;
  log.push({type:"strength", date:new Date().toISOString(), sessionId:state.active, entries:entries});
  saveLog(); renderHeader(); renderMain(); flash("Séance enregistrée");
}

/* ---- Mobilité ---- */
function viewMobilite(){
  var r=STRETCH.filter(function(x){return x.id===state.routine;})[0];
  var h='<div class="tabs">';
  STRETCH.forEach(function(x){
    var on=(state.routine===x.id);
    h+='<button class="tab" data-rout="'+x.id+'"'+(on?' style="background:'+x.tag+'22;box-shadow:inset 0 0 0 1px '+x.tag+'"':'')+'>'+
       '<div class="num mono">'+x.n+'</div><div class="ti"><span class="dot" style="background:'+x.tag+'"></span>'+x.title.replace("Mobilité ","")+'</div></button>';
  });
  h+='</div><div class="sub">'+r.long+'</div>';
  h+='<div class="block"><div class="elabel">Étirements · tenue lente, sans à-coups</div>';
  r.items.forEach(function(it){
    h+='<div class="card"><div class="nm">'+it.name+'</div>'+
       '<div class="rx"><b class="mono">'+it.hold+'</b>'+(it.note?" · "+it.note:"")+'</div>';
    var ht=STRETCH_HOW[it.id];
    if(ht){ h+='<button class="howbtn" data-how="'+it.id+'">Comment faire ›</button>'+
      '<div class="howpanel" id="how-'+it.id+'"><div class="howmove">'+esc(ht.how)+'</div>'+
      '<div class="howcues">'+ht.cues.map(function(c){return '<div class="cue">'+esc(c)+'</div>';}).join("")+'</div>'+
      '<a class="demolink" href="https://www.youtube.com/results?search_query='+encodeURIComponent(it.name+' stretch')+'" target="_blank" rel="noopener">▶ Voir une démo vidéo</a></div>'; }
    h+='<div class="stretch-actions">'+
       '<button class="play" data-hold="'+it.holdSec+'" data-name="'+esc(it.name)+'">▶ Démarrer '+it.holdSec+'s</button>'+
       '<button class="check" data-str="'+it.id+'" aria-label="Étirement fait">'+CHECK_SVG+'</button></div></div>';
  });
  h+='</div>';
  h+='<div class="savebar"><div class="savebar-in"><button class="save empty" id="finishStretch">Terminer la mobilité</button></div></div>';
  return h;
}
function wireMobilite(){
  Array.prototype.forEach.call(document.querySelectorAll("[data-rout]"), function(b){
    b.onclick=function(){ state.routine=b.getAttribute("data-rout"); renderMain(); };
  });
  Array.prototype.forEach.call(document.querySelectorAll("#main .play"), function(btn){
    btn.onclick=function(){ startTimer(parseInt(btn.getAttribute("data-hold"),10), btn.getAttribute("data-name")); };
  });
  Array.prototype.forEach.call(document.querySelectorAll("#main .check[data-str]"), function(btn){
    btn.onclick=function(){ btn.classList.toggle("on"); refreshFinishStretch(); };
  });
  Array.prototype.forEach.call(document.querySelectorAll("#main .howbtn"), function(btn){
    btn.onclick=function(){
      var p=document.getElementById("how-"+btn.getAttribute("data-how"));
      var open=p.classList.toggle("open");
      btn.textContent = open ? "Masquer les détails" : "Comment faire ›";
    };
  });
  var fin=document.getElementById("finishStretch");
  if(fin) fin.onclick=finishStretch;
  refreshFinishStretch();
}
function stretchDoneCount(){ return document.querySelectorAll("#main .check[data-str].on").length; }
function refreshFinishStretch(){
  var fin=document.getElementById("finishStretch"); if(!fin) return;
  var c=stretchDoneCount();
  fin.className="save"+(c?"":" empty");
  fin.textContent="Terminer la mobilité"+(c?" ("+c+")":"");
}
function finishStretch(){
  var c=stretchDoneCount(); if(c===0) return;
  var r=STRETCH.filter(function(x){return x.id===state.routine;})[0];
  log.push({type:"stretch", date:new Date().toISOString(), routineId:state.routine, done:c, total:r.items.length});
  saveLog(); renderMain(); flash("Mobilité enregistrée");
}

/* ---- Progrès (courbes) ---- */
function progExercises(){
  var out=[];
  Object.keys(ALL_ITEMS).forEach(function(id){
    var series=[];
    log.forEach(function(e){
      if(e.type==="stretch") return;
      if(e.entries && e.entries[id]){
        var reps=e.entries[id].map(function(s){return parseInt(s.reps,10);}).filter(function(n){return !isNaN(n);});
        if(reps.length){
          var total=reps.reduce(function(a,b){return a+b;},0);
          series.push({date:e.date, total:total});
        }
      }
    });
    if(series.length) out.push({id:id, name:ALL_ITEMS[id].name, tag:EX_TAG[id]||"#8B5CF6", series:series});
  });
  return out;
}
function buildChart(cur){
  var s=cur.series, tag=cur.tag, n=s.length;
  var W=320,H=170,padL=30,padR=12,padT=14,padB=26;
  var maxV=Math.max.apply(null, s.map(function(d){return d.total;})); if(maxV<=0) maxV=1;
  var yMax=Math.max(1, Math.ceil(maxV*1.15));
  function X(i){ return n<=1 ? (padL+(W-padL-padR)/2) : padL + i*(W-padL-padR)/(n-1); }
  function Y(v){ return padT + (H-padT-padB)*(1 - v/yMax); }
  var grid="";
  [0,0.5,1].forEach(function(f){ var yv=Math.round(yMax*f), y=Y(yv);
    grid+='<line x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'" stroke="var(--border)" stroke-width="1"/>';
    grid+='<text x="'+(padL-6)+'" y="'+(y+3)+'" fill="var(--muted)" font-size="9" text-anchor="end" font-family="monospace">'+yv+'</text>';
  });
  var pts=s.map(function(d,i){return X(i)+","+Y(d.total);});
  var area="", poly="";
  if(n>1){
    area='<polygon points="'+X(0)+','+Y(0)+' '+pts.join(" ")+' '+X(n-1)+','+Y(0)+'" fill="url(#garea)"/>';
    poly='<polyline points="'+pts.join(" ")+'" fill="none" stroke="url(#gline)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>';
  }
  var dots="";
  s.forEach(function(d,i){ dots+='<circle cx="'+X(i)+'" cy="'+Y(d.total)+'" r="'+(i===n-1?4:3)+'" fill="'+(i===n-1?tag:"var(--panel)")+'" stroke="'+tag+'" stroke-width="2"/>'; });
  var xlab='<text x="'+X(0)+'" y="'+(H-8)+'" fill="var(--muted)" font-size="9" text-anchor="middle" font-family="monospace">'+fmtDate(s[0].date)+'</text>';
  if(n>1) xlab+='<text x="'+X(n-1)+'" y="'+(H-8)+'" fill="var(--muted)" font-size="9" text-anchor="middle" font-family="monospace">'+fmtDate(s[n-1].date)+'</text>';
  var svg='<svg viewBox="0 0 '+W+' '+H+'" class="chart" preserveAspectRatio="xMidYMid meet">'+
    '<defs>'+
    '<linearGradient id="gline" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="var(--amber)"/><stop offset="1" stop-color="var(--blue)"/></linearGradient>'+
    '<linearGradient id="garea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+tag+'" stop-opacity="0.22"/><stop offset="1" stop-color="'+tag+'" stop-opacity="0"/></linearGradient>'+
    '</defs>'+grid+area+poly+dots+xlab+'</svg>';
  var last=s[n-1].total, first=s[0].total, delta=last-first, ds=(delta>0?"+":"")+delta;
  var stats='<div class="pstats">'+
    '<div class="pstat"><div class="pv mono">'+last+'</div><div class="pl">reps (dernière)</div></div>'+
    '<div class="pstat"><div class="pv mono" style="color:'+(delta>=0?"var(--green)":"#F87171")+'">'+ds+'</div><div class="pl">évolution</div></div>'+
    '<div class="pstat"><div class="pv mono">'+n+'</div><div class="pl">séances</div></div></div>';
  var cap='<div class="pcap">Reps totales par séance'+(n<2?' · une seule séance pour l\'instant — reviens après la prochaine pour voir la courbe':'')+'</div>';
  return '<div class="chartcard">'+svg+cap+stats+'</div>';
}
function buildWeightChart(s){
  var n=s.length, W=320,H=150,padL=34,padR=12,padT=12,padB=24;
  var vals=s.map(function(d){return d.v;});
  var mn=Math.min.apply(null,vals), mx=Math.max.apply(null,vals);
  var yMin=Math.floor(mn-1), yMax=Math.ceil(mx+1); if(yMax<=yMin) yMax=yMin+1;
  function X(i){ return n<=1?(padL+(W-padL-padR)/2):padL+i*(W-padL-padR)/(n-1); }
  function Y(v){ return padT+(H-padT-padB)*(1-(v-yMin)/(yMax-yMin)); }
  var grid="";
  [0,0.5,1].forEach(function(f){ var yv=Math.round(yMin+(yMax-yMin)*f), y=Y(yv);
    grid+='<line x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'" stroke="var(--border)" stroke-width="1"/>';
    grid+='<text x="'+(padL-6)+'" y="'+(y+3)+'" fill="var(--muted)" font-size="9" text-anchor="end" font-family="monospace">'+yv+'</text>';
  });
  var pts=s.map(function(d,i){return X(i)+","+Y(d.v);});
  var poly=n>1?'<polyline points="'+pts.join(" ")+'" fill="none" stroke="url(#wline)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>':"";
  var dots=""; s.forEach(function(d,i){ dots+='<circle cx="'+X(i)+'" cy="'+Y(d.v)+'" r="'+(i===n-1?4:3)+'" fill="'+(i===n-1?"var(--blue)":"var(--panel)")+'" stroke="var(--blue)" stroke-width="2"/>'; });
  var xlab='<text x="'+X(0)+'" y="'+(H-7)+'" fill="var(--muted)" font-size="9" text-anchor="middle" font-family="monospace">'+fmtDate(s[0].date)+'</text>';
  if(n>1) xlab+='<text x="'+X(n-1)+'" y="'+(H-7)+'" fill="var(--muted)" font-size="9" text-anchor="middle" font-family="monospace">'+fmtDate(s[n-1].date)+'</text>';
  var svg='<svg viewBox="0 0 '+W+' '+H+'" class="chart" preserveAspectRatio="xMidYMid meet"><defs><linearGradient id="wline" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="var(--violet2)"/><stop offset="1" stop-color="var(--blue)"/></linearGradient></defs>'+grid+poly+dots+xlab+'</svg>';
  var last=s[n-1].v, first=s[0].v, delta=Math.round((last-first)*10)/10, ds=(delta>0?"+":"")+delta;
  return svg+'<div class="pstats"><div class="pstat"><div class="pv mono">'+last+'</div><div class="pl">kg (dernier)</div></div>'+
    '<div class="pstat"><div class="pv mono">'+ds+'</div><div class="pl">évolution</div></div>'+
    '<div class="pstat"><div class="pv mono">'+n+'</div><div class="pl">mesures</div></div></div>';
}
function viewProgress(){
  var ws=weightSeries(), exs=progExercises();
  var h='<div class="prog">';
  h+='<div class="wcard"><div class="wtitle">Poids du corps</div>'+
     '<div class="wrow2"><input class="winp" id="wkg" inputmode="decimal" placeholder="ex. 74.5"><button class="wsave" id="wsave">Enregistrer</button></div>';
  h+= ws.length ? buildWeightChart(ws) : '<div class="pcap">Note ton poids pour lancer la courbe.</div>';
  h+='</div>';
  if(exs.length===0){
    h+='<div class="empty-h">Pas encore de séances de force.<br>Enregistre-en pour voir tes courbes par exercice.</div></div>';
    return h;
  }
  var sel=state.progEx; if(!sel||!exs.some(function(x){return x.id===sel;})) sel=exs[0].id;
  var cur=exs.filter(function(x){return x.id===sel;})[0];
  h+='<div class="plabel">Progression par exercice</div><select class="progsel" id="progsel">';
  exs.forEach(function(x){ h+='<option value="'+x.id+'"'+(x.id===sel?" selected":"")+'>'+esc(x.name)+'</option>'; });
  h+='</select>'+buildChart(cur)+'</div>';
  return h;
}
function wireProgress(){
  var sel=document.getElementById("progsel");
  if(sel) sel.onchange=function(){ state.progEx=sel.value; renderMain(); };
  var wsb=document.getElementById("wsave");
  if(wsb) wsb.onclick=function(){
    var inp=document.getElementById("wkg"), v=parseFloat(String(inp.value).replace(",","."));
    if(isNaN(v)||v<=0){ flash("Entre un poids valide"); return; }
    log.push({type:"weight", date:new Date().toISOString(), kg:v});
    saveLog(); renderMain(); flash("Poids enregistré");
  };
}

/* ---- Historique ---- */
function viewHist(){
  var h='<div class="hist"><div class="iobar">'+
        '<button class="iobtn" id="exportBtn">⭳ Exporter</button>'+
        '<button class="iobtn" id="importBtn">⭱ Importer</button></div>';
  if(log.length===0){
    h+='<div class="empty-h">Aucune séance enregistrée pour l\'instant.<br>Tes séances validées apparaîtront ici.</div></div>';
    return h;
  }
  var rev=log.slice().reverse();
  var led=lastExportDays();
  var remTxt = led===null ? (log.length?"Jamais exporté — pense à sauvegarder tes données":"") : ("Dernière sauvegarde il y a "+led+" jour"+(led>1?"s":""));
  var remCls = ((led===null && log.length) || (led!==null && led>=7)) ? " warn" : "";
  var reminder = remTxt ? '<div class="saverem'+remCls+'">'+remTxt+'</div>' : '';
  h+=reminder;
  rev.forEach(function(e){
    if(e.type==="stretch"){
      var r=STRETCH.filter(function(x){return x.id===e.routineId;})[0];
      h+='<div class="hentry"><div class="hh"><span class="hs" style="color:'+(r?r.tag:"#fff")+'">'+(r?r.title:"Mobilité")+'</span>'+
         '<span class="hd mono">'+fmtDate(e.date)+'</span></div><div class="hb mono">'+e.done+'/'+e.total+' étirements</div></div>';
    } else if(e.type==="combat"){
      h+='<div class="hentry"><div class="hh"><span class="hs" style="color:#8B5CF6">Krav maga</span>'+
         '<span class="hd mono">'+fmtDate(e.date)+'</span></div><div class="hb mono">séance de combat</div></div>';
    } else if(e.type==="weight"){
      h+='<div class="hentry"><div class="hh"><span class="hs" style="color:var(--blue)">Poids</span>'+
         '<span class="hd mono">'+fmtDate(e.date)+'</span></div><div class="hb mono">'+e.kg+' kg</div></div>';
    } else {
      var s=SESSIONS.filter(function(x){return x.id===e.sessionId;})[0];
      var summary=Object.keys(e.entries).map(function(id){
        var nm=(ALL_ITEMS[id]?ALL_ITEMS[id].name:id);
        var vals=e.entries[id].map(function(x){return (x.reps||"·")+(x.load?"+"+x.load:"");}).join(" · ");
        return nm+" → "+vals;
      }).join("\n");
      h+='<div class="hentry"><div class="hh"><span class="hs" style="color:'+(s?s.tag:"#fff")+'">'+(s?s.title:"Séance")+'</span>'+
         '<span class="hd mono">'+fmtDate(e.date)+'</span></div><div class="hb mono">'+esc(summary)+'</div></div>';
    }
  });
  h+='<button class="danger" id="clearBtn">Effacer l\'historique</button></div>';
  return h;
}
function wireHist(){
  var ex=document.getElementById("exportBtn"); if(ex) ex.onclick=doExport;
  var im=document.getElementById("importBtn"); if(im) im.onclick=function(){ document.getElementById("importfile").click(); };
  var cl=document.getElementById("clearBtn");
  if(cl) cl.onclick=function(){ if(confirm("Effacer tout l'historique ? Cette action est définitive.")){ log=[]; saveLog(); renderHeader(); renderMain(); flash("Historique effacé"); } };
}

/* ---------- export / import ---------- */
function doExport(){
  var data=JSON.stringify(log, null, 2);
  var blob=new Blob([data], {type:"application/json"});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");
  a.href=url; a.download="ats-"+new Date().toISOString().slice(0,10)+".json";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  setLastExport(); renderMain();
  flash("Historique exporté");
}
document.getElementById("importfile").addEventListener("change", function(ev){
  var f=ev.target.files[0]; if(!f) return;
  var reader=new FileReader();
  reader.onload=function(){
    try{
      var data=JSON.parse(reader.result);
      if(!Array.isArray(data)){ alert("Fichier invalide : ce n'est pas un export ATS."); return; }
      if(!confirm("Remplacer l'historique actuel par ce fichier ("+data.length+" entrées) ?")) return;
      log=data; saveLog(); renderHeader(); state.mode="hist"; renderMain(); renderNav(); flash("Historique importé");
    }catch(e){ alert("Impossible de lire ce fichier."); }
  };
  reader.readAsText(f);
  ev.target.value="";
});

/* ---------- minuteur ---------- */
function renderTimer(){
  var el=document.getElementById("timerbar");
  if(!timer){ el.innerHTML=""; return; }
  el.innerHTML='<div class="timer'+(timer.done?" done":"")+'">'+
    '<span class="tlabel">'+(timer.done?"Terminé — "+esc(timer.label):esc(timer.label))+'</span>'+
    '<span class="tclock">'+fmtClock(timer.left)+'</span>'+
    (timer.done?"":'<button class="tbtn" id="tAdd">+15s</button><button class="tbtn" id="tPause">'+(timer.running?"II":"▶")+'</button>')+
    '<button class="tbtn tx" id="tClose" aria-label="Fermer">✕</button></div>';
  var a=document.getElementById("tAdd"); if(a) a.onclick=function(){ timer.left+=15; timer.total+=15; timer.done=false; timer.running=true; ensureInterval(); renderTimer(); };
  var p=document.getElementById("tPause"); if(p) p.onclick=function(){ timer.running=!timer.running; ensureInterval(); renderTimer(); };
  var c=document.getElementById("tClose"); if(c) c.onclick=function(){ clearTimer(); };
}
function ensureInterval(){
  if(timerIv){ clearInterval(timerIv); timerIv=null; }
  if(timer && timer.running){
    timerIv=setInterval(function(){
      if(!timer){ clearInterval(timerIv); timerIv=null; return; }
      if(timer.left<=1){
        timer.left=0; timer.running=false; timer.done=true;
        clearInterval(timerIv); timerIv=null;
        beep(); if(navigator.vibrate) navigator.vibrate([120,60,120]);
        renderTimer();
        setTimeout(function(){ if(timer && timer.done) clearTimer(); }, 5000);
        return;
      }
      timer.left-=1; renderTimer();
    }, 1000);
  }
}
function startTimer(sec, label){ ensureAudio(); timer={left:sec, total:sec, running:true, done:false, label:label}; ensureInterval(); renderTimer(); }
function clearTimer(){ if(timerIv){ clearInterval(timerIv); timerIv=null; } timer=null; renderTimer(); }

/* ---------- toast ---------- */
var toastTimer=null;
function flash(msg){
  var el=document.getElementById("toast");
  el.innerHTML='<div class="toast">'+esc(msg)+'</div>';
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){ el.innerHTML=""; }, 1800);
}

/* ---------- init ---------- */
renderHeader(); renderNav(); renderMain();
</script>
